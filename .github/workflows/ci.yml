name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Build the raw extracts
        run: python -m src.data.make_dataset --n-auctions 48000 --seed 42

      # The gate. Audits the columns the model actually consumes and exits
      # non-zero on any leakage finding, so a regression fails the build rather
      # than quietly inflating the next set of metrics.
      - name: Leakage audit
        run: python -m src.features.leakage_audit

      - name: Tests
        run: python -m pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds both stages, which trains the model inside the builder. If the
      # image cannot be produced, this fails here rather than in someone's
      # terminal.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: melbourne-clearance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the served model
        run: |
          set -uo pipefail
          # No --rm: if the container dies we still want its logs.
          docker run -d -p 8000:8000 --name clearance melbourne-clearance:ci

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            if [ -z "$(docker ps -q -f name=clearance)" ]; then
              echo "::error::container exited before serving a request"
              break
            fi
            sleep 2
          done

          echo "--- /health ---"
          curl -sf http://localhost:8000/health | tee /tmp/health.json || true
          echo
          grep -q '"status":"ok"' /tmp/health.json

          echo "--- /predict ---"
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"suburb":"Northcote","auction_date":"2025-03-15","property_type":"h",
                 "bedrooms":3,"bathrooms":1,"car_spaces":1,"land_size_sqm":372,
                 "building_area_sqm":128,"year_built":1925,
                 "guide_price_low":1480000,"guide_price_high":1620000}' \
            | tee /tmp/predict.json
          echo
          grep -q 'clearance_probability' /tmp/predict.json

      - name: Container logs
        if: always()
        run: |
          echo "--- docker logs ---"
          docker logs clearance 2>&1 || echo "(no container)"
          docker rm -f clearance > /dev/null 2>&1 || true
